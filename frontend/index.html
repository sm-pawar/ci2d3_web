<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI2D3 Ice Island Explorer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <span class="brand-icon">🧊</span> CI2D3 Ice Island Explorer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" id="toggleFilter">
                            <i class="bi bi-funnel"></i> Filter
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="toggleLayers">
                            <i class="bi bi-layers"></i> Layers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="aboutBtn">
                            <i class="bi bi-info-circle"></i> About
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Sidebar for Filters -->
            <div class="col-md-3 sidebar" id="filterPanel">
                <div class="panel-header">
                    <h5>Filter Ice Islands</h5>
                    <button type="button" class="btn-close" id="closeFilter"></button>
                </div>

                <div class="panel-content">
                    <form id="filterForm">
                        <div class="mb-3">
                            <label for="filterField" class="form-label">Attribute</label>
                            <select class="form-select" id="filterField" required>
                                <option value="">Select attribute...</option>
                                <option value="calvingloc">Calving Location</option>
                                <option value="carving_year">Calving Year</option>
                                <option value="area_km2">Area (km²)</option>
                                <option value="perimeter_km">Perimeter (km)</option>
                                <option value="max_length_km">Max Length (km)</option>
                                <option value="thickness_m">Thickness (m)</option>
                                <option value="status">Status</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="filterOperator" class="form-label">Operator</label>
                            <select class="form-select" id="filterOperator" required>
                                <option value="=">=</option>
                                <option value="!=">!=</option>
                                <option value=">">></option>
                                <option value="<"><</option>
                                <option value=">=">>=</option>
                                <option value="<="><=</option>
                                <option value="LIKE">LIKE</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="filterValue" class="form-label">Value</label>
                            <input type="text" class="form-control" id="filterValue"
                                   placeholder="Enter value..." required>
                            <small class="form-text text-muted">
                                Examples: PG, 2010, 100
                            </small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Apply Filter</button>
                            <button type="button" class="btn btn-secondary" id="clearFilter">Clear Filter</button>
                        </div>
                    </form>

                    <div id="filterResults" class="mt-3">
                        <!-- Filter results will appear here -->
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div class="col-md-9 map-container" id="mapContainer">
                <div id="map"></div>

                <!-- Inspect Panel (initially hidden) -->
                <div class="inspect-panel" id="inspectPanel">
                    <div class="panel-header">
                        <h6>Feature Information</h6>
                        <button type="button" class="btn-close" id="closeInspect"></button>
                    </div>
                    <div class="panel-content" id="inspectContent">
                        <p class="text-muted">Click on an ice island to view details</p>
                    </div>
                </div>

                <!-- Loading Indicator -->
                <div class="loading-indicator" id="loadingIndicator">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script src="js/config.js"></script>
    <script src="js/map.js"></script>
    <script src="js/inspect.js"></script>
    <script src="js/filter.js"></script>
</body>
</html>
