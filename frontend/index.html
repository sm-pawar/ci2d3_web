<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI2D3 Ice Island Explorer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Main Content - Fullscreen for embedding -->
    <div class="container-fluid h-100 p-0">
        <div class="row h-100 g-0">
            <!-- Sidebar for Filters -->
            <div class="col-md-3 sidebar" id="filterPanel">
                <div class="panel-header">
                    <h5>Filter Ice Islands</h5>
                    <button type="button" class="btn-close" id="closeFilter"></button>
                </div>

                <div class="panel-content">
                    <form id="filterForm">
                        <div class="mb-3">
                            <label for="filterField" class="form-label">Attribute</label>
                            <select class="form-select" id="filterField" required>
                                <option value="">Select attribute...</option>
                                <option value="calvingloc" data-type="character varying">Calving Location</option>
                                <option value="calvingyr" data-type="character varying">Calving Year</option>
                                <option value="area" data-type="numeric" selected>Area</option>
                                <option value="perimeter" data-type="numeric">Perimeter</option>
                                <option value="length" data-type="numeric">Length</option>
                                <option value="lon" data-type="numeric">Longitude</option>
                                <option value="lat" data-type="numeric">Latitude</option>
                                <option value="inst" data-type="character varying">Institution</option>
                                <option value="lineage" data-type="character varying">Lineage</option>
                                <option value="sensor" data-type="character varying">Sensor</option>
                                <option value="scenedate" data-type="character varying">Scene Date</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="filterOperator" class="form-label">Operator</label>
                            <select class="form-select" id="filterOperator" required>
                                <!-- Options populated dynamically by JavaScript based on field type -->
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="filterValue" class="form-label">Value</label>
                            <input type="text" class="form-control" id="filterValue"
                                   placeholder="Enter value..." value="100" required>
                            <small class="form-text text-muted">
                                Examples: PG (calvingloc), 2010 (calvingyr), 100 (area)
                            </small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Apply Filter</button>
                            <button type="button" class="btn btn-secondary" id="clearFilter">Clear Filter</button>
                        </div>
                    </form>

                    <div id="filterResults" class="mt-3">
                        <!-- Filter results will appear here -->
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div class="col-md-9 map-container" id="mapContainer">
                <div id="map"></div>

                <!-- Inspect Panel (initially hidden) -->
                <div class="inspect-panel" id="inspectPanel">
                    <div class="panel-header">
                        <h6>Feature Information</h6>
                        <button type="button" class="btn-close" id="closeInspect"></button>
                    </div>
                    <div class="panel-content" id="inspectContent">
                        <p class="text-muted">Click on an ice island to view details</p>
                    </div>
                    <div class="panel-footer" id="inspectFooter">
                        <button type="button" class="btn btn-primary btn-track-lineage" id="trackLineageBtn" disabled>
                            Track Lineage
                        </button>
                    </div>
                </div>

                <!-- Loading Indicator -->
                <div class="loading-indicator" id="loadingIndicator">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script src="js/config.js"></script>
    <script src="js/map.js"></script>
    <script src="js/inspect.js"></script>
    <script src="js/filter.js"></script>
</body>
</html>
