# ==============================================================================
# Add this location block to the EXISTING backend nginx.conf, INSIDE the
# `listen 443 ssl;` server block for geo.wirl.carleton.ca - right next to the
# existing `location /geoserver/ { ... }`.
#
# It exposes the Flask API under the SAME host and the SAME IP allow-list as
# GeoServer, so the API is reachable only from Carleton / the frontend box and
# never from the open internet. The frontend server proxies the browser's
# .../ci2d3_v1_map/api/* requests here from IP 206.12.98.25 (allow-listed).
# ==============================================================================

        location /api/ {
            # Same allow-list as /geoserver/ - keep them in sync.
            allow 206.12.98.25;    # wirl.carleton.ca (frontend box, proxy hop)
            allow 134.117.254.66;  # wirlserv.carleton.ca (pollux)
            allow 134.117.0.0/16;  # any Carleton IP (on the VPN)
            deny all;

            # Pass the URI through unchanged: Flask registers its routes under
            # /api/ (e.g. /api/filter, /api/inspect/<id>, /api/lineage).
            proxy_pass http://flask-api:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
