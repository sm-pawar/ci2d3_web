# ==============================================================================
# CI2D3 map app - in-container nginx (frontend / WordPress server)
# ==============================================================================
#
# This runs INSIDE the dedicated `ci2d3` container on the WordPress box. It is
# NOT the public-facing nginx; the site's existing `reverse-proxy` terminates
# TLS and forwards the sub-path
#     https://wirl.carleton.ca/ci2d3_v1_map/
# to this container as plain HTTP with the sub-path stripped (proxy_pass with a
# trailing slash). So here we see requests at "/", "/css/...", "/js/...",
# "/geoserver/..." and "/api/...".
#
# Two jobs:
#   1. Serve the static map app (baked into the image at /usr/share/nginx/html).
#   2. Reverse-proxy /geoserver and /api on to the backend server. Because this
#      hop egresses from the WordPress box's public IP (206.12.98.25, which the
#      backend's nginx allow-list already permits), the backend stays closed to
#      the public and the browser only ever talks to wirl.carleton.ca -> no CORS.
#
# To point at a different backend, change BACKEND_HOST below (one place).
# ==============================================================================

# Backend (GeoServer + Flask API) public HTTPS host. Requests to it originate
# from this server's IP, which the backend allow-lists.
# BACKEND_HOST = geo.wirl.carleton.ca

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads / large WMS + lineage responses.
    client_max_body_size 16m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ---- Static map app --------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- GeoServer (WMS / WFS / GetFeatureInfo) --------------------------
    # Browser calls .../ci2d3_v1_map/geoserver/... ; the outer reverse-proxy
    # strips the sub-path, so this location sees /geoserver/... and forwards it
    # to the backend, whose own nginx enforces the IP allow-list.
    location /geoserver/ {
        proxy_pass https://geo.wirl.carleton.ca/geoserver/;
        proxy_ssl_server_name on;              # send SNI for the TLS handshake
        proxy_set_header Host              geo.wirl.carleton.ca;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # ---- Flask API -------------------------------------------------------
    location /api/ {
        proxy_pass https://geo.wirl.carleton.ca/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host              geo.wirl.carleton.ca;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
