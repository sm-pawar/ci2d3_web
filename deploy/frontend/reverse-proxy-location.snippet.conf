# ==============================================================================
# Add these TWO location blocks to the EXISTING wirl.carleton.ca :443 server
# block in the reverse-proxy config (reverse-proxy/nginx/conf.d/default.conf).
#
# They sit INSIDE:
#
#     server {
#         listen 443 ssl;
#         server_name wirl.carleton.ca www.wirl.carleton.ca;
#         ...
#         location / { proxy_pass http://wordpress:80/; }   # existing - leave as-is
#
#         # >>> paste the two blocks below, ABOVE or BELOW location / (order
#         #     does not matter: a longer prefix always wins in nginx) <<<
#     }
#
# This is the ONLY change to the live site config. WordPress at "/" and the
# existing WordPress page at /research/ice/ice-islands/ci2d3/ keep working -
# the app path below is a deeper, more specific prefix, so nginx routes it here
# first and everything else still falls through to WordPress.
# ==============================================================================

        # CI2D3 map app. No trailing slash on the location + trailing slash on
        # proxy_pass => the "/research/.../ci2d3_v1_map/" prefix is stripped
        # before reaching the ci2d3 container, which serves the app at its root.
        location /research/ice/ice-islands/ci2d3/ci2d3_v1_map/ {
            proxy_pass http://ci2d3:80/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Redirect the bare path (no trailing slash) to the slashed form, so the
        # app's relative asset URLs (css/, js/) resolve correctly.
        location = /research/ice/ice-islands/ci2d3/ci2d3_v1_map {
            return 301 $scheme://$host$request_uri/;
        }
