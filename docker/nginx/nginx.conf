# ==============================================================================
# CI2D3 Ice Island Explorer - Reverse Proxy
# ==============================================================================
#
# Puts the whole portal behind a single public port (80), so the site is
# reached at http://<EC2-PUBLIC-IP>/ with no port suffix.
#
# Everything else (GeoServer 8080, Flask 5000, PostGIS 5432) is bound to
# 127.0.0.1 in docker-compose.yml and is therefore NOT reachable from the
# internet. Those services are only reachable:
#   - from inside the Docker network (how nginx talks to them), or
#   - from the EC2 box itself / through an SSH tunnel (for admin work).
#
# Routes:
#   /            -> GeoServer Tomcat ROOT webapp (the frontend)
#   /geoserver/  -> GeoServer (WMS, WFS, admin UI)
#   /api/        -> Flask API
#   /health      -> Flask health check (convenience for monitoring)
#
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # WMS tiles and large lineage responses can be sizeable.
    client_max_body_size 16m;

    # Log to stdout/stderr so `docker-compose logs nginx` shows traffic.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream geoserver_upstream {
        server geoserver:8080;
    }

    upstream flask_upstream {
        server flask-api:5000;
    }

    server {
        listen 80;
        server_name _;

        # Common proxy headers. X-Forwarded-* let GeoServer build correct
        # absolute URLs when it sits behind this proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ---- Flask API -------------------------------------------------------
        location /api/ {
            proxy_pass http://flask_upstream/api/;
            proxy_read_timeout 120s;
        }

        # Flask health check, handy for monitoring from outside the box.
        location = /health {
            proxy_pass http://flask_upstream/health;
        }

        # ---- GeoServer -------------------------------------------------------
        # Serves WMS/WFS for the map, and the admin UI at /geoserver/web/.
        location /geoserver/ {
            proxy_pass http://geoserver_upstream/geoserver/;
            proxy_read_timeout 300s;

            # To lock the GeoServer admin UI down to your own IP, uncomment the
            # block below and set your address. WMS/WFS under /geoserver/ci2d3/
            # keeps working for everyone.
            #
            # location /geoserver/web/ {
            #     allow 203.0.113.10;   # <- your IP
            #     deny  all;
            #     proxy_pass http://geoserver_upstream/geoserver/web/;
            # }
        }

        # ---- Frontend --------------------------------------------------------
        # The Tomcat ROOT webapp, which is the ./frontend directory.
        location / {
            proxy_pass http://geoserver_upstream/;
        }
    }
}
